# =============================================================================
# Package inventory — single source of truth for the run_once_before_install
# install script. Consumed via `{{ .packages.* }}` in templates.
#
# Per AGENTS.md docs-sync rule: if you change a brew/cask/npm package here, also
# update the README "What `.chezmoidata.yaml` installs" block in the same commit.
# The `theme.tokyo_night_moon` palette below is also part of the source of
# truth — it is consumed (read-only) by the `*.tmpl` tool configs at apply
# time, never by an install run-script.
# =============================================================================

packages:
  brew:
    # Zsh ecosystem (all required for the .zshrc to work properly)
    main:
      - starship
      - eza
      - bat
      - fzf
      - zoxide
      - fd
      - git-delta
      - lazygit
      - lazydocker
    # CLI utilities
    cli:
      - jq
      - yq
      - htop
      - tree
      - btop
      - herdr
      - glow       # markdown renderer (Charmbracelet)
      - bandwhich  # live network bandwidth monitor (needs `sudo bandwhich` for raw-socket capture on macOS)
      - dust       # du successor (Rust)
      - hunk       # review-first terminal diff viewer for agent-authored changesets (hunk.dev)
      - terraform-linters/tap/tflint  # Terraform linter (removed from homebrew-core under BUSL-1.1; tap-qualified name auto-taps)
    # Git platform CLIs
    git_platform:
      - gh
      - glab
    # Cloud platform CLIs
    cloud:
      - azure-cli  # Microsoft Azure CLI (provides the `az` binary); core brew formula
    # Kubernetes tooling
    k8s:
      - kubectl
      - helm
      - k9s
      - kubectx    # context switcher (also provides `kubens` for namespaces); core brew formula
    # Build tools
    build:
      - cmake
    # Neovim + language runtimes
    dev:
      - neovim
      - node
      - npm
      - ripgrep
  npm_global:
    - "@fission-ai/openspec@latest"
    - "@earendil-works/pi-coding-agent@latest"

# Pi (the @earendil-works/pi-coding-agent harness) packages installed into
# ~/.pi/agent/settings.json's `packages` array by
# run_onchange_before_configure-pi-packages.sh.tmpl. Append-only: entries here
# are *ensured present* by the jq merge — interactive `pi install` adds and any
# entries later removed from this list are left on disk (removal requires
# `pi remove npm:<pkg>`).
pi:
  packages:
    - npm:pi-mcp-adapter        # MCP (Model Context Protocol) server support
    - npm:pi-subagents          # task delegation / chains / parallel / TUI clarify
    - npm:pi-web-access         # web search + URL fetch + GitHub clone + PDF/YT
    - npm:pi-hermes-memory      # local memory + SQLite FTS5 search + secret scanning
    - npm:@narumitw/pi-plan-mode # Codex-like read-only /plan collaboration mode
    - npm:context-mode          # MCP plugin: ~98% context savings via sandboxed exec + FTS5 KB

# macOS-only packages
macos:
  brew:
    # Docker runtime (Colima — lightweight, no GUI). docker-compose provides the
    # v2 compose plugin; run_onchange_before_configure-docker-cli-plugins wires
    # cliPluginsExtraDirs into ~/.docker/config.json so `docker compose`
    # resolves out of the box.
    docker_runtime:
      - colima
      - docker
      - docker-compose
    casks:
      - 1password-cli
      - ghostty
      - font-meslo-lg-nerd-font

# =============================================================================
# Tokyo Night Moon palette — single source of truth for every tool config that
# hardcodes terminal colors. Consumed via `{{ .theme.tokyo_night_moon.<key> }}`
# by the `*.tmpl` config sources (starship, git/delta, lazygit, hunk, btop,
# ghostty, zshrc fzf, pi/claude/opencode theme JSON). Editing a value here
# propagates to every templated config on the next `chezmoi apply`.
#
# Values match folke/tokyonight.nvim `moon` variant exactly. A few entries are
# tool-specific shades kept for byte-identical render fidelity (documented
# inline) rather than the canonical accent — centralizing does NOT mean
# normalizing divergent tool choices; it means moving them to one place.
# Out of scope this pass: dot_config/bat/themes/tokyonight_moon.tmTheme (a
# vendored TextMate grammar with hundreds of scope->hex entries) stays literal.
# =============================================================================
theme:
  tokyo_night_moon:
    # --- surfaces (Moon) ---
    bg:               "#222436"   # main background
    bg_dark:          "#1f2335"   # darker surface / panels
    bg_alt:           "#1e2030"   # starship color_panel, opencode bg_panel
    bg_highlight:     "#2f334d"   # current-line / selection bg / fzf bg+
    terminal_black:   "#444a73"   # opencode border_active
    page_bg:          "#1a1b26"   # pi export page bg (Night variant bg, kept for fidelity)
    # --- foregrounds ---
    fg:               "#c8d3f5"   # main foreground
    fg_dark:          "#a9b1d6"   # punctuation, dimmed text
    fg_gutter:        "#3b4261"   # gutter / line numbers / panel chrome
    dark5:            "#737aa2"   # secondary text (tokyonight `dark5`)
    comment:          "#636da6"   # comments, muted text
    # --- accents (Moon) ---
    blue:             "#82aaff"
    blue0:            "#3d59a1"   # muted blue (hunk accentMuted, claude claudeShimmer)
    blue1:            "#7aa2f7"   # thinking-low / plan-mode
    cyan:             "#86e1fc"
    cyan1:            "#7dcfff"   # opencode cyan_alt
    green:            "#c3e88d"
    magenta:          "#c099ff"
    orange:           "#ff966c"
    yellow:           "#ffc777"
    red:              "#ff757f"
    red_alt:          "#f7768e"   # opencode red — Night variant, kept for byte-fidelity
    red1:             "#c53b53"   # delta minus line-numbers, lazygit unstaged
    teal:             "#4fd6be"   # delta plus line-numbers, opencode teal
    border_teal:      "#0db9d7"   # fzf border/scrollbar, lazygit inactive border
    change_gray:      "#828bb8"   # opencode diffContext "change"
    # --- diff tints (pi/claude semantic bg tints) ---
    tint_green:       "#1b2a3b"   # pi tintGreen, claude diffAdded
    tint_red:         "#2d1f23"   # pi tintRed, claude diffRemoved
    selection:        "#2d3f76"   # pi selection
    # --- git delta diff line styles (blended diff backgrounds) ---
    delta_minus:      "#4b2a3d"   # delta minus-style / minus-empty-line-marker
    delta_minus_emph: "#713137"   # delta minus-emph-style
    delta_plus:       "#2a4556"   # delta plus-style / plus-empty-line-marker
    delta_plus_emph:  "#2c5a66"   # delta plus-emph-style