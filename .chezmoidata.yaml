# =============================================================================
# Package inventory — single source of truth for the run_once_before_install
# install script. Consumed via `{{ .packages.* }}` in templates.
#
# Per AGENTS.md docs-sync rule: if you change a brew/cask/npm package here, also
# update the README "What `.chezmoidata.yaml` installs" block in the same commit.
# The `theme.tokyo_night_moon` palette below is also part of the source of
# truth — it is consumed (read-only) by the `*.tmpl` tool configs at apply
# time, never by an install run-script.
# =============================================================================

packages:
  brew:
    # Zsh ecosystem (all required for the .zshrc to work properly)
    main:
      - starship
      - eza
      - bat
      - fzf
      - zoxide
      - fd
      - git-delta
      - lazygit
      - lazydocker
    # CLI utilities
    cli:
      - jq
      - yq
      - htop
      - tree
      - btop
      - herdr
      - glow       # markdown renderer (Charmbracelet)
      - bandwhich  # live network bandwidth monitor (needs `sudo bandwhich` for raw-socket capture on macOS)
      - dust       # du successor (Rust)
      - hunk       # review-first terminal diff viewer for agent-authored changesets (hunk.dev)
      - atuin      # shell history manager + searchable history (sync optional); integrates with zsh
      - yamllint   # YAML linter
      - terraform-linters/tap/tflint  # Terraform linter (removed from homebrew-core under BUSL-1.1; tap-qualified name auto-taps)
      - hashicorp/tap/terraform    # Terraform CLI (removed from homebrew-core under BUSL-1.1; tap-qualified name auto-taps)
    # Git platform CLIs
    git_platform:
      - gh
      - glab
    # Cloud platform CLIs
    cloud:
      - azure-cli  # Microsoft Azure CLI (provides the `az` binary); core brew formula
    # Kubernetes tooling
    k8s:
      - kubectl
      - helm
      - k9s
      - kubectx    # context switcher (also provides `kubens` for namespaces); core brew formula
    # Build tools
    build:
      - cmake
    # Neovim + language runtimes
    dev:
      - neovim
      - node
      - npm
      - ripgrep
  npm_global:
    - "@fission-ai/openspec@latest"
    - "@earendil-works/pi-coding-agent@latest"

# Pi (the @earendil-works/pi-coding-agent harness) packages installed into
# ~/.pi/agent/settings.json's `packages` array by
# run_onchange_before_configure-pi-packages.sh.tmpl. Append-only: entries here
# are *ensured present* by the jq merge — interactive `pi install` adds and any
# entries later removed from this list are left on disk (removal requires
# `pi remove npm:<pkg>`).
pi:
  packages:
    - npm:pi-mcp-adapter        # MCP (Model Context Protocol) server support
    - npm:pi-subagents          # task delegation / chains / parallel / TUI clarify
    - npm:pi-web-access         # web search + URL fetch + GitHub clone + PDF/YT
    - npm:pi-hermes-memory      # local memory + SQLite FTS5 search + secret scanning
    - npm:@narumitw/pi-plan-mode # Codex-like read-only /plan collaboration mode
    - npm:context-mode          # MCP plugin: ~98% context savings via sandboxed exec + FTS5 KB

# macOS-only packages
macos:
  brew:
    # Docker runtime (Colima — lightweight, no GUI). docker-compose provides the
    # v2 compose plugin; run_onchange_before_configure-docker-cli-plugins wires
    # cliPluginsExtraDirs into ~/.docker/config.json so `docker compose`
    # resolves out of the box.
    docker_runtime:
      - colima
      - docker
      - docker-compose
    casks:
      - 1password-cli
      - ghostty
      - font-meslo-lg-nerd-font

# =============================================================================
# Toolchain catalog — per-tool metadata (Title / Description / Help) consumed
# ONLY by the `toolchain` command (dot_local/bin/executable_toolchain.tmpl).
# The install lists above remain the source of truth for WHAT gets installed;
# this map curates HOW each tool is described in `toolchain`. Keys MUST match
# the exact formula/cask/npm-string used in the install lists — key-equality
# enforces docs-sync (a list entry with a missing tools: key renders a glaring
# "(missing entry in tools map)" row in `toolchain`).
#
# Resolution (applied at chezmoi apply/render time, in the template):
#   title: defaults to `base <key>` (last "/" path component); override where
#          the binary name differs (git-delta→delta, neovim→nvim, …).
#   desc:  curated one-liner.
#   help:  defaults to "<title> --help"; "—" where there is no CLI help
#          (GUI cask apps, fonts). Pi-plugin rows default to "pi --help".
# =============================================================================
tools:
  # Zsh ecosystem (packages.brew.main)
  starship:
    desc: "Cross-shell prompt (Tokyo Night)"
  eza:
    desc: "ls replacement with icons & git status"
  bat:
    desc: "cat clone with syntax highlighting (Tokyo Night)"
  fzf:
    desc: "Fuzzy finder for files, commands, history"
  zoxide:
    desc: "Smarter cd with frecency tracking"
  fd:
    desc: "Fast find replacement (paired with fzf)"
  git-delta:
    title: delta
    desc: "Syntax-highlighted git diff pager"
  lazygit:
    desc: "TUI git client"
  lazydocker:
    desc: "TUI Docker client"

  # CLI utilities (packages.brew.cli)
  jq:
    desc: "JSON processor & query language"
  yq:
    desc: "YAML/TOML/JSON/XML processor"
  htop:
    desc: "Interactive process viewer"
  tree:
    desc: "Recursive directory listing"
  btop:
    desc: "Resource monitor (Tokyo Night)"
  herdr:
    desc: "Terminal workspace multiplexer"
  glow:
    desc: "Markdown renderer in the terminal"
  bandwhich:
    desc: "Live network bandwidth monitor (per-process)"
  dust:
    desc: "du successor with a tree view (Rust)"
  hunk:
    desc: "Review-first diff viewer for AI-authored changesets"
  atuin:
    desc: "Searchable shell history (sync optional)"
  yamllint:
    desc: "YAML linter"
  "terraform-linters/tap/tflint":
    desc: "Terraform linter"
  "hashicorp/tap/terraform":
    desc: "IaC provisioning CLI"

  # Git platform CLIs (packages.brew.git_platform)
  gh:
    desc: "GitHub CLI"
  glab:
    desc: "GitLab CLI"

  # Cloud platform CLIs (packages.brew.cloud)
  azure-cli:
    title: az
    desc: "Microsoft Azure CLI"

  # Kubernetes (packages.brew.k8s)
  kubectl:
    desc: "Kubernetes cluster control CLI"
  helm:
    desc: "Kubernetes package manager"
  k9s:
    desc: "TUI Kubernetes cluster manager"
  kubectx:
    desc: "Kubernetes context/namespace switcher"

  # Build tools (packages.brew.build)
  cmake:
    desc: "Cross-platform build system generator"

  # Neovim + language runtimes (packages.brew.dev)
  neovim:
    title: nvim
    desc: "Vim-fork editor (AstroNvim, Tokyo Night)"
  node:
    desc: "JavaScript runtime"
  npm:
    desc: "Node package manager"
  ripgrep:
    title: rg
    desc: "Fast recursive grep (paired with neovim)"

  # Docker runtime — macOS (macos.brew.docker_runtime)
  colima:
    desc: "Lightweight Docker runtime (no GUI; replaces Docker Desktop)"
  docker:
    desc: "Docker CLI"
  docker-compose:
    title: "docker compose"
    desc: "Docker Compose v2 plugin"

  # Homebrew casks — macOS (macos.brew.casks)
  "1password-cli":
    title: op
    desc: "1Password CLI (secret manager)"
  ghostty:
    desc: "GPU-accelerated terminal emulator (Tokyo Night)"
    help: "—"
  font-meslo-lg-nerd-font:
    title: "MesloLGS NF (font)"
    desc: "Meslo Nerd Font (icons for starship/eza)"
    help: "—"

  # npm globals (packages.npm_global)
  "@fission-ai/openspec@latest":
    title: openspec
    desc: "Spec-driven AI coding workflow"
  "@earendil-works/pi-coding-agent@latest":
    title: pi
    desc: "Open-source AI coding harness"

  # Pi agent packages (pi.packages) — help defaults to "pi --help"
  "npm:pi-mcp-adapter":
    title: pi-mcp-adapter
    desc: "MCP (Model Context Protocol) server support"
  "npm:pi-subagents":
    title: pi-subagents
    desc: "Task delegation / chains / parallel / TUI"
  "npm:pi-web-access":
    title: pi-web-access
    desc: "Web search + URL fetch + GitHub clone"
  "npm:pi-hermes-memory":
    title: pi-hermes-memory
    desc: "Local memory + SQLite FTS5 search"
  "npm:@narumitw/pi-plan-mode":
    title: pi-plan-mode
    desc: "Codex-like read-only /plan collaboration mode"
  "npm:context-mode":
    title: context-mode
    desc: "Context savings via sandboxed exec + FTS5 KB"

# =============================================================================
# Tokyo Night Moon palette — single source of truth for every tool config that
# hardcodes terminal colors. Consumed via `{{ .theme.tokyo_night_moon.<key> }}`
# by the `*.tmpl` config sources (starship, git/delta, lazygit, hunk, btop,
# ghostty, zshrc fzf, pi/claude/opencode theme JSON). Editing a value here
# propagates to every templated config on the next `chezmoi apply`.
#
# Values match folke/tokyonight.nvim `moon` variant exactly. A few entries are
# tool-specific shades kept for byte-identical render fidelity (documented
# inline) rather than the canonical accent — centralizing does NOT mean
# normalizing divergent tool choices; it means moving them to one place.
# Out of scope this pass: dot_config/bat/themes/tokyonight_moon.tmTheme (a
# vendored TextMate grammar with hundreds of scope->hex entries) stays literal.
# =============================================================================
theme:
  tokyo_night_moon:
    # --- surfaces (Moon) ---
    bg:               "#222436"   # main background
    bg_dark:          "#1f2335"   # darker surface / panels
    bg_alt:           "#1e2030"   # starship color_panel, opencode bg_panel
    bg_highlight:     "#2f334d"   # current-line / selection bg / fzf bg+
    terminal_black:   "#444a73"   # opencode border_active
    page_bg:          "#1a1b26"   # pi export page bg (Night variant bg, kept for fidelity)
    # --- foregrounds ---
    fg:               "#c8d3f5"   # main foreground
    fg_dark:          "#a9b1d6"   # punctuation, dimmed text
    fg_gutter:        "#3b4261"   # gutter / line numbers / panel chrome
    dark5:            "#737aa2"   # secondary text (tokyonight `dark5`)
    comment:          "#636da6"   # comments, muted text
    # --- accents (Moon) ---
    blue:             "#82aaff"
    blue0:            "#3d59a1"   # muted blue (hunk accentMuted, claude claudeShimmer)
    blue1:            "#7aa2f7"   # thinking-low / plan-mode
    cyan:             "#86e1fc"
    cyan1:            "#7dcfff"   # opencode cyan_alt
    green:            "#c3e88d"
    magenta:          "#c099ff"
    orange:           "#ff966c"
    yellow:           "#ffc777"
    red:              "#ff757f"
    red_alt:          "#f7768e"   # opencode red — Night variant, kept for byte-fidelity
    red1:             "#c53b53"   # delta minus line-numbers, lazygit unstaged
    teal:             "#4fd6be"   # delta plus line-numbers, opencode teal
    border_teal:      "#0db9d7"   # fzf border/scrollbar, lazygit inactive border
    change_gray:      "#828bb8"   # opencode diffContext "change"
    # --- diff tints (pi/claude semantic bg tints) ---
    tint_green:       "#1b2a3b"   # pi tintGreen, claude diffAdded
    tint_red:         "#2d1f23"   # pi tintRed, claude diffRemoved
    selection:        "#2d3f76"   # pi selection
    # --- git delta diff line styles (blended diff backgrounds) ---
    delta_minus:      "#4b2a3d"   # delta minus-style / minus-empty-line-marker
    delta_minus_emph: "#713137"   # delta minus-emph-style
    delta_plus:       "#2a4556"   # delta plus-style / plus-empty-line-marker
    delta_plus_emph:  "#2c5a66"   # delta plus-emph-style