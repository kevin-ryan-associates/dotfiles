# Tokyo Night Moon custom theme. hunk ships 65 bundled Shiki themes
# including `tokyo-night` (the Night variant, #1a1b26 bg). There is no
# bundled Tokyo Night *Moon* — this inherits from `tokyo-night` and overrides
# the surface chrome plus syntax scopes to match the folke/tokyonight.nvim
# Moon palette (bg #222436, fg #c8d3f5) used by every other tool in this repo.
# Schema: github.com/modem-dev/hunk `src/core/config.ts` + `src/ui/themes.ts`.
theme = "custom"

[custom_theme]
base = "tokyo-night"
label = "Tokyo Night Moon"

# Surface chrome (overrides Night-derived #1a1b26 surface)
background = "#222436"
panel = "#1f2335"
panelAlt = "#3b4261"
border = "#3b4261"
text = "#c8d3f5"
muted = "#636da6"

# Diff sign colors (Moon gitSigns palette — brighter than Night's green/red)
addedSignColor = "#c3e88d"
removedSignColor = "#ff757f"

# Accent / selection — Moon blue
accent = "#82aaff"
accentMuted = "#3d59a1"
selectedHunk = "#82aaff"

# Context surfaces
contextBg = "#222436"
contextContentBg = "#222436"
lineNumberBg = "#222436"
lineNumberFg = "#737aa2"

# Sidebar file-status badges (Moon git palette)
badgeAdded = "#c3e88d"
badgeRemoved = "#ff757f"
badgeNeutral = "#636da6"
fileNew = "#c3e88d"
fileDeleted = "#ff757f"
fileRenamed = "#ffc777"
fileModified = "#82aaff"
fileUntracked = "#c099ff"

# Inline agent notes — magenta border for visibility against diff
noteBorder = "#c099ff"
noteBackground = "#1f2335"
noteTitleBackground = "#1f2335"
noteTitleText = "#c8d3f5"

[custom_theme.syntax_scopes]
"comment" = "#636da6"
"punctuation.definition.comment" = "#636da6"
"punctuation.special" = "#636da6"
"keyword" = "#c099ff"
"keyword.control" = "#c099ff"
"keyword.operator" = "#86e1fc"
"storage" = "#c099ff"
"storage.type" = "#ffc777"
"entity.name.function" = "#82aaff"
"support.function" = "#82aaff"
"entity.name.class" = "#ffc777"
"entity.name.type" = "#ffc777"
"support.type" = "#ffc777"
"variable" = "#c8d3f5"
"variable.language" = "#86e1fc"
"variable.parameter" = "#c8d3f5"
"constant" = "#ff966c"
"constant.numeric" = "#ff966c"
"constant.language" = "#ff966c"
"string" = "#c3e88d"
"punctuation" = "#a9b1d6"
"entity.name.tag" = "#ff966c"
"entity.other.attribute-name" = "#c099ff"
"markup.heading" = "#ff966c"
"markup.inserted" = "#c3e88d"
"markup.deleted" = "#ff757f"
"markup.changed" = "#82aaff"